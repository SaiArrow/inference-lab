# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: inference-lab }
  template:
    metadata:
      labels: { app: inference-lab }
    spec:
      containers:
        - name: api
          image: inference-lab:local
          imagePullPolicy: IfNotPresent      # required — k3d has no upstream registry
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ORT_THREADS,          value: "2" }
            - { name: BATCHING,             value: "1" }
            - { name: HF_HUB_OFFLINE,       value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15